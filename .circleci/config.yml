version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -e ".[dev]"
      - run:
          name: Run tests
          command: pytest -v --tb=short --junitxml=test-results/results.xml
      - store_test_results:
          path: test-results

workflows:
  main:
    jobs:
      - test