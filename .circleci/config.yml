version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.2

    steps:
      - checkout

      - restore_cache:
          keys:
            - bundle-v1-{{ checksum "Gemfile.lock" }}
            - bundle-v1-

      - run:
          name: Install dependencies
          command: bundle install --path vendor/bundle

      - save_cache:
          key: bundle-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - run:
          name: Run tests
          command: bundle exec rspec --format documentation